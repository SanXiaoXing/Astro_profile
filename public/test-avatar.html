<!DOCTYPE html>
<html>
<head>
<style>
.avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  overflow: hidden;
  background: #eee;
  position: relative;
}
.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>
<div class="avatar"><img src="/favicon.svg" alt="test"></div>
</body>
</html>
